name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install native image codec dependencies
        # QA-597: SkiaSharp on Linux needs libwebp for WebP decode/encode.
        # Without it, OrthoCasePresentationTests.WebpPhoto_IsTranscodedAndEmbedded
        # fails intermittently when SkiaSharp falls back to a stub codec.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebp-dev

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release --warnaserror:CS9113

      - name: Run unit tests (with coverage)
        run: >
          dotnet test tests/AqlanDentalPro.UnitTests/AqlanDentalPro.UnitTests.csproj
          --no-restore --no-build --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Enforce coverage thresholds (baseline safety net)
        # TEST-19: Non-blocking baseline. Current coverage is ~6% lines / ~28% branches
        # (very large code-base, mostly untested). Aspirational targets are 60% lines / 50%
        # branches but those would break CI today. Safety-net thresholds below are set to
        # current-2% so the check still catches significant regressions without blocking.
        # Ratchet these up over time as more tests are added. Remove `continue-on-error`
        # once the safety net reaches 60% lines / 50% branches.
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob("TestResults/**/coverage.cobertura.xml", recursive=True)
          if not files:
              print("::warning::No coverage file found — skipping threshold check")
              raise SystemExit(0)
          tree = ET.parse(files[0])
          root = tree.getroot()
          line_rate = float(root.attrib["line-rate"]) * 100
          branch_rate = float(root.attrib["branch-rate"]) * 100
          print(f"::notice::Backend coverage — Lines: {line_rate:.2f}%  Branches: {branch_rate:.2f}%")
          print(f"Coverage file: {files[0]}")
          # Safety-net thresholds (current-2% baseline). Aspirational: 60% lines / 50% branches.
          LINE_THRESHOLD = 4.0
          BRANCH_THRESHOLD = 26.0
          ok = True
          if line_rate < LINE_THRESHOLD:
              print(f"::error::Line coverage {line_rate:.2f}% < {LINE_THRESHOLD}% safety-net threshold")
              ok = False
          if branch_rate < BRANCH_THRESHOLD:
              print(f"::error::Branch coverage {branch_rate:.2f}% < {BRANCH_THRESHOLD}% safety-net threshold")
              ok = False
          if ok:
              print(f"::notice::Coverage above safety-net thresholds (lines≥{LINE_THRESHOLD}% branches≥{BRANCH_THRESHOLD}%). Aspirational targets: 60% lines / 50% branches — ratchet up over time.")
          raise SystemExit(0 if ok else 1)
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/tests/AqlanDentalPro.UnitTests/TestResults/**/*.trx
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/TestResults/**/coverage.cobertura.xml
          retention-days: 7
          if-no-files-found: ignore

  backend-integration:
    name: Backend — Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run integration tests (TEST-18, Testcontainers PostgreSQL)
        # TEST-18 / C-08 safety net: these tests spin up a throwaway postgres:16-alpine
        # container via Testcontainers (Docker is preinstalled on GitHub-hosted ubuntu
        # runners, no extra service config needed) and exercise cross-request race
        # conditions (appointment double-booking, treasury concurrency, surgery status
        # transitions, patient access control) plus schema-drift detection between the
        # EF model and the live database. This job has NEVER run before in CI (the
        # project existed but was not wired in — see docs/agent-audit/c-08-startup-maintenance-audit.md
        # section 6).
        #
        # CORE-CI-001: continue-on-error is REMOVED. It was added so a first run could fail
        # without blocking, with the stated intention of dropping it "once this job is
        # observed green for a few consecutive runs". It never was green — every integration
        # test has failed since the job was wired in, and every run reported success. A check
        # that is green whether or not the tests pass is worse than no check: it looks exactly
        # like one that means something. The coverage step above keeps its allowance, which is
        # an intentional ratchet rather than a claim about test outcomes.
        run: >
          dotnet test tests/AqlanDentalPro.IntegrationTests/AqlanDentalPro.IntegrationTests.csproj
          --no-restore --no-build --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=integration-test-results.trx"
          --results-directory ./TestResults

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-results
          # CORE-CI-001: --results-directory is ./TestResults relative to the `backend`
          # working directory, so results land in backend/TestResults — not under the test
          # project. Every run logged "No files were found" regardless of outcome.
          path: backend/TestResults/**/*.trx
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend — Lint, Type-check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run frontend tests (with coverage)
        run: npx vitest run --coverage --reporter=verbose

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Check e2e staging env
        id: gate
        env:
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
        run: |
          if [ -n "${E2E_API_URL}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_API_URL is set — Playwright will run against ${E2E_API_URL}"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_API_URL secret is not set — Playwright tests will be skipped (CI stays green)."
          fi

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.gate.outputs.enabled == 'true'
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        if: steps.gate.outputs.enabled == 'true'
        env:
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
          E2E_STAFF_PHONE: ${{ secrets.E2E_STAFF_PHONE }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
          E2E_PORTAL_USERNAME: ${{ secrets.E2E_PORTAL_USERNAME }}
          E2E_PORTAL_PASSWORD: ${{ secrets.E2E_PORTAL_PASSWORD }}
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/playwright-test-output/
          retention-days: 7
          if-no-files-found: ignore
