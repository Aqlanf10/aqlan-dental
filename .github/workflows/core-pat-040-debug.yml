name: CORE-PAT-040 Unit Test Diagnostics

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/core-pat-040-active-patient-write-guard'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release --warnaserror:CS9113
      - name: Capture concise failures
        run: |
          set +e
          dotnet test tests/AqlanDentalPro.UnitTests/AqlanDentalPro.UnitTests.csproj \
            --no-restore --no-build --configuration Release --verbosity normal \
            > /tmp/core-pat-040-tests.txt 2>&1
          status=$?
          grep -E "(^  Failed |^    Error Message:|^    Stack Trace:|^Failed!|^Passed!|^Total tests:|^     Failed:|^     Passed:|^ Test Run Failed|ArgumentException|ActivePatientWriteGuard)" \
            /tmp/core-pat-040-tests.txt \
            > ../docs/audits/CORE-PAT-040_UNIT_TEST_DIAGNOSTICS.txt || true
          printf '\nEXIT_STATUS=%s\n' "$status" >> ../docs/audits/CORE-PAT-040_UNIT_TEST_DIAGNOSTICS.txt
          exit 0
      - name: Commit diagnostics
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/CORE-PAT-040_UNIT_TEST_DIAGNOSTICS.txt
          git commit -m "chore: capture concise CORE-PAT-040 diagnostics"
          git push
