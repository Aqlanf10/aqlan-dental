name: Encoding Guard

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  w05-ui-read-model-patch:
    if: github.head_ref == 'codex/w05-clinic-business-date' && github.actor != 'github-actions[bot]'
    name: Apply W05 UI and Read Model Patch Once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/w05-clinic-business-date
          fetch-depth: 0

      - name: Apply W05 UI and read-model patch
        run: python scripts/w05_ui_and_read_model_patch.py

      - name: Restore workflow and commit patch
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/encoding-guard.yml
          rm -f scripts/w05_ui_and_read_model_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(journey): add manager future-date override workflow"
          git push origin HEAD:codex/w05-clinic-business-date

  mojibake:
    name: Arabic Mojibake Guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Arabic UTF-8 text is not corrupted
        run: bash scripts/check-mojibake.sh

      - name: Check cephalometric AI documentation contract
        shell: pwsh
        run: ./scripts/check-ceph-ai-docs.ps1
