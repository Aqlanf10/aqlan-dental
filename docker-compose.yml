services:
  postgres:
    image: postgres:16-alpine
    container_name: aqlan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aqlan_dental}
      POSTGRES_USER: ${POSTGRES_USER:-aqlan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aqlan_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aqlan} -d ${POSTGRES_DB:-aqlan_dental}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aqlan_net

  redis:
    image: redis:7-alpine
    container_name: aqlan_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-aqlan_redis_dev}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aqlan_redis_dev}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aqlan_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aqlan_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;
        Database=${POSTGRES_DB:-aqlan_dental};
        Username=${POSTGRES_USER:-aqlan};
        Password=${POSTGRES_PASSWORD:-aqlan_dev_password};
        Port=5432
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:-aqlan_redis_dev}"
      Jwt__SecretKey: ${JWT_SECRET_KEY:-dev_secret_key_change_in_production_must_be_long}
      Jwt__Issuer: ${JWT_ISSUER:-AqlanDentalPro}
      Jwt__Audience: ${JWT_AUDIENCE:-AqlanDentalProClient}
      Jwt__AccessTokenExpiryMinutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:-15}
      Jwt__RefreshTokenExpiryDays: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:-7}
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aqlan_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aqlan_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@aqlan.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-aqlan_pgadmin_dev}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aqlan_net
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:

networks:
  aqlan_net:
    driver: bridge
