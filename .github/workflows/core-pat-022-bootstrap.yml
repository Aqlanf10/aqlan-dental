name: CORE-PAT-022 Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'agent/core-pat-022-patient-table-reliability' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-pat-022-patient-table-reliability
          fetch-depth: 0

      - name: Execute embedded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/core-pat-022-patch.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script_lines = workflow[start:end]
          indent = min(len(line) - len(line.lstrip()) for line in script_lines if line.strip())
          script = '\n'.join(line[indent:] for line in script_lines)
          exec(compile(script, 'core-pat-022', 'exec'))
          PY
          rm -f .github/workflows/core-pat-022-bootstrap.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(patients): CORE-PAT-022 stabilize table search and paging [core-pat-022-done]"
          git push origin HEAD:agent/core-pat-022-patient-table-reliability
