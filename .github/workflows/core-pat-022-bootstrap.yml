name: CORE-PAT-022 Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'agent/core-pat-022-patient-table-reliability' && !contains(github.event.pull_request.title, '[core-pat-022-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-pat-022-patient-table-reliability
          fetch-depth: 0

      - name: Apply patient table patch
        run: python scripts/core_pat_022_patch.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(patients): CORE-PAT-022 stabilize table search and paging [core-pat-022-done]"
          git push origin HEAD:agent/core-pat-022-patient-table-reliability
