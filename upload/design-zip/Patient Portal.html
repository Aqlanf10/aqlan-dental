function Btn({children, variant='primary', full=false, onClick, small=false, disabled=false}) {

  return (
    <button
      onClick={onClick}
      disabled={disabled}
      style={{
        width: full ? '100%' : 'auto',
        padding: small ? '8px 16px' : '13px 20px',
        borderRadius: 12, border: border[variant] || 'none',
        background: disabled ? '#e2eaf4' : bg[variant] || C.blue,
        color: disabled ? C.lightGray : col[variant] || '#fff',
        fontFamily: 'Tajawal', fontWeight: 700,
        fontSize: small ? 13 : 15,
        cursor: disabled ? 'not-allowed' : 'pointer',

        transition: 'all 0.15s',
        boxShadow: variant === 'primary' && !disabled ? '0 4px 12px rgba(61,122,181,0.3)' : 'none',

}

// ── Appointments Screen ──────────────────────

            <div style={{textAlign: 'center', fontSize: 48, marginBottom: 16}}>{inst.icon}</div>

            <p style={{fontSize: 14, color: C.gray, lineHeight: 2}}>{inst.content}</p>

  return (

              <div style={{width: 48, height: 48, borderRadius: 14, background: (catColors[inst.category]||C.blue) + '18', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 24, flexShrink: 0}}>
                {inst.icon}

// ── Account Screen ──────────────────────
function AccountScreen() {
  const pct = Math.round((ACCOUNT.paid / ACCOUNT.total) * 100);

  const paidCount = ACCOUNT.payments.filter(p => p.status === 'paid').length;

  return (
    <div style={{flex: 1, overflowY: 'auto'}}>
      <Header title="كشف حسابي"/>

      {/* Summary card */}

          <div style={{fontSize: 12, opacity: 0.6, marginBottom: 4}}>إجمالي عقد العلاج</div>
          <div style={{fontSize: 28, fontWeight: 800, marginBottom: 16}}>{ACCOUNT.total.toLocaleString()} ر.ي</div>
          <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 12, marginBottom: 16}}>
            {[
              {label: 'المدفوع', val: ACCOUNT.paid, color: C.green},
              {label: 'المتبقي', val: remaining, color: C.orange},
              {label: 'الأقساط', val: ACCOUNT.installments + ' قسط', color: 'rgba(255,255,255,0.8)', noFormat: true},
            ].map(s => (
              <div key={s.label} style={{background: 'rgba(255,255,255,0.08)', borderRadius: 12, padding: 10, textAlign: 'center'}}>
                <div style={{fontSize: 10, opacity: 0.6, marginBottom: 4}}>{s.label}</div>
                <div style={{fontSize: 13, fontWeight: 800, color: s.color}}>
                  {s.noFormat ? s.val : (s.val/1000).toFixed(0) + 'K'}
                </div>
              </div>
            ))}
          </div>
          <div style={{marginBottom: 6}}>
            <div style={{display: 'flex', justifyContent: 'space-between', fontSize: 11, opacity: 0.7, marginBottom: 4}}>
              <span>نسبة التحصيل</span><span>{pct}%</span>
            </div>
            <div style={{height: 8, background: 'rgba(255,255,255,0.15)', borderRadius: 99, overflow: 'hidden'}}>
              <div style={{width: `${pct}%`, height: '100%', background: `linear-gradient(90deg, ${C.green}, #16a34a)`, borderRadius: 99}}/>
            </div>
          </div>
          <div style={{fontSize: 12, opacity: 0.6}}>
            ✅ {paidCount} أقساط مدفوعة من أصل {ACCOUNT.installments}

        </div>

        {/* Next payment */}
        <Card style={{marginBottom: 16, border: `1.5px solid ${C.orange}30`, background: C.orange + '06'}}>
          <div style={{display: 'flex', gap: 12, alignItems: 'center'}}>
            <div style={{fontSize: 28}}>💳</div>
            <div>
              <div style={{fontSize: 13, color: C.gray, marginBottom: 2}}>القسط القادم</div>
              <div style={{fontSize: 16, fontWeight: 800, color: C.primary}}>{ACCOUNT.monthlyInstallment.toLocaleString()} ر.ي</div>
              <div style={{fontSize: 12, color: C.orange}}>📅 22 نوفمبر 2024</div>
            </div>
          </div>
        </Card>

        {/* Payments list */}
        <div style={{fontWeight: 700, fontSize: 14, color: C.primary, marginBottom: 10}}>سجل المدفوعات</div>
        <div style={{display: 'flex', flexDirection: 'column', gap: 8}}>
          {ACCOUNT.payments.map(p => (
            <Card key={p.id} padding={12}>
              <div style={{display: 'flex', gap: 12, alignItems: 'center'}}>
                <div style={{width: 36, height: 36, borderRadius: 99, background: p.status === 'paid' ? C.green + '18' : C.orange + '18', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0}}>
                  <span style={{fontSize: 16}}>{p.status === 'paid' ? '✅' : '⏳'}</span>
                </div>
                <div style={{flex: 1}}>
                  <div style={{fontSize: 13, fontWeight: 700, color: C.primary}}>{p.status === 'paid' ? p.date : 'قادم — ' + p.date}</div>
                  <div style={{fontSize: 11, color: C.lightGray}}>
                    {p.status === 'paid' ? `${p.method} · ${p.receipt}` : 'لم يُسدَّد بعد'}
                  </div>
                </div>
                <div style={{fontSize: 14, fontWeight: 800, color: p.status === 'paid' ? C.green : C.orange}}>
                  {p.amount.toLocaleString()} ر.ي
                </div>
              </div>
            </Card>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Messages Screen ──────────────────────
function MessagesScreen({onNewMsg}) {
  const [messages, setMessages] = useState(MESSAGES_INIT);
  const [input, setInput] = useState('');
  const bottomRef = useRef(null);

  useEffect(() => {
    if (bottomRef.current) {
      bottomRef.current.parentElement.scrollTop = bottomRef.current.offsetTop;
    }
  }, [messages]);

  const sendMessage = () => {
    if (!input.trim()) return;
    setMessages(prev => [...prev, {
      id: Date.now(), from: 'patient',
      text: input.trim(),
      time: '9:41 ص', date: 'الآن', read: true,
    }]);
    setInput('');
    if (onNewMsg) onNewMsg();
    // Simulate reply after delay
    setTimeout(() => {
      setMessages(prev => [...prev, {
        id: Date.now() + 1, from: 'clinic',
        name: 'ريم (الاستقبال)',
        text: 'شكراً لتواصلك معنا! سيتم الرد عليك في أقرب وقت ممكن خلال أوقات العمل.',
        time: '9:42 ص', date: 'الآن', read: true,
      }]);
    }, 1500);
  };

  return (
    <div style={{flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden'}}>
      <Header title="رسائلي" right={
        <div style={{display: 'flex', gap: 6, alignItems: 'center'}}>
          <div style={{width: 8, height: 8, borderRadius: 99, background: C.green, animation: 'pulse 2s infinite'}}/>
          <span style={{color: 'rgba(255,255,255,0.7)', fontSize: 11}}>متصل</span>
        </div>
      }/>

      {/* Clinic info bar */}
      <div style={{background: C.blue + '10', padding: '10px 16px', display: 'flex', gap: 10, alignItems: 'center', borderBottom: `1px solid ${C.border}`, flexShrink: 0}}>
        <div style={{width: 36, height: 36, borderRadius: 99, background: C.blue, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, fontWeight: 800, color: '#fff', flexShrink: 0}}>ع</div>
        <div>
          <div style={{fontWeight: 700, fontSize: 13, color: C.primary}}>مركز د. عقلان الكامل</div>
          <div style={{fontSize: 11, color: C.green}}>● متاح الآن</div>
        </div>
        <div style={{marginRight: 'auto', fontSize: 11, color: C.lightGray}}>الأوقات: 9ص–9م</div>
      </div>

      {/* Messages */}
      <div style={{flex: 1, overflowY: 'auto', padding: '12px 14px', display: 'flex', flexDirection: 'column', gap: 10}}>
        {messages.map(m => {
          const isPatient = m.from === 'patient';
          return (
            <div key={m.id} style={{display: 'flex', flexDirection: 'column', alignItems: isPatient ? 'flex-start' : 'flex-end', animation: 'fadeUp 0.2s ease'}}>
              {!isPatient && m.name && (
                <div style={{fontSize: 10, color: C.lightGray, marginBottom: 3, marginLeft: 8}}>{m.name}</div>
              )}
              <div style={{
                maxWidth: '78%', padding: '10px 14px', borderRadius: isPatient ? '16px 16px 16px 4px' : '16px 16px 4px 16px',
                background: isPatient ? '#fff' : C.blue,
                color: isPatient ? C.primary : '#fff',
                boxShadow: '0 2px 8px rgba(0,0,0,0.06)',
                border: isPatient ? `1px solid ${C.border}` : 'none',
                fontSize: 13, lineHeight: 1.6, fontWeight: 500,
              }}>
                {m.text}
              </div>
              <div style={{fontSize: 10, color: C.lightGray, marginTop: 3, marginLeft: 4, marginRight: 4}}>
                {m.time} · {m.date}
                {isPatient && ' ✓'}
              </div>
            </div>
          );
        })}
        <div ref={bottomRef}/>
      </div>

      {/* Input */}
      <div style={{padding: '10px 12px', background: '#fff', borderTop: `1px solid ${C.border}`, display: 'flex', gap: 8, alignItems: 'flex-end', flexShrink: 0}}>
        <button style={{width: 40, height: 40, borderRadius: 99, background: C.border, border: 'none', fontSize: 18, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0}}>
          📎
        </button>
        <div style={{flex: 1, background: C.bg, borderRadius: 20, padding: '8px 14px', border: `1.5px solid ${C.border}`}}>
          <textarea
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
            placeholder="اكتب رسالتك هنا..."
            style={{width: '100%', background: 'none', border: 'none', fontFamily: 'Tajawal', fontSize: 13, color: C.primary, resize: 'none', outline: 'none', maxHeight: 80, minHeight: 20, direction: 'rtl'}}
            rows={1}
          />
        </div>
        <button
          onClick={sendMessage}
          disabled={!input.trim()}
          style={{width: 40, height: 40, borderRadius: 99, background: input.trim() ? C.blue : C.border, border: 'none', cursor: input.trim() ? 'pointer' : 'not-allowed', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, boxShadow: input.trim() ? '0 3px 10px rgba(61,122,181,0.4)' : 'none', transition: 'all 0.15s'}}>
          <span style={{fontSize: 18, transform: 'scaleX(-1)', display: 'block'}}>➤</span>
        </button>
      </div>
    </div>
  );
}

// ── Main App ──────────────────────
function PatientApp() {
  const [loggedIn, setLoggedIn] = useState(false);
  const [tab, setTab] = useState('home');
  const [unreadMsgs, setUnreadMsgs] = useState(1);

  const SCREENS = {
    home: <HomeScreen onNavigate={setTab}/>,
    appointments: <AppointmentsScreen/>,
    instructions: <InstructionsScreen/>,
    account: <AccountScreen/>,
    messages: <MessagesScreen onNewMsg={() => {}}/>,
  };

  return (
    <PhoneShell>
      {!loggedIn ? (
        <LoginScreen onLogin={() => setLoggedIn(true)}/>
      ) : (
        <>
          <div style={{flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column', animation: 'fadeUp 0.3s ease'}}>
            {SCREENS[tab]}
          </div>
          <BottomNav active={tab} onChange={(t) => { setTab(t); if(t==='messages') setUnreadMsgs(0); }} msgCount={unreadMsgs}/>
        </>
      )}
    </PhoneShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PatientApp/>);
</script>
