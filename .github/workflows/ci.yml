name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release --warnaserror:CS9113

      - name: Run unit tests
        run: >
          dotnet test tests/AqlanDentalPro.UnitTests/AqlanDentalPro.UnitTests.csproj
          --no-restore --no-build --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/tests/AqlanDentalPro.UnitTests/TestResults/**/*.trx
          retention-days: 7

  frontend:
    name: Frontend — Lint, Type-check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run frontend tests
        run: npx vitest run --reporter=verbose

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Check e2e staging env
        id: gate
        env:
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
        run: |
          if [ -n "${E2E_API_URL}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_API_URL is set — Playwright will run against ${E2E_API_URL}"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_API_URL secret is not set — Playwright tests will be skipped (CI stays green)."
          fi

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.gate.outputs.enabled == 'true'
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        if: steps.gate.outputs.enabled == 'true'
        env:
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
          E2E_STAFF_PHONE: ${{ secrets.E2E_STAFF_PHONE }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
          E2E_PORTAL_USERNAME: ${{ secrets.E2E_PORTAL_USERNAME }}
          E2E_PORTAL_PASSWORD: ${{ secrets.E2E_PORTAL_PASSWORD }}
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/playwright-test-output/
          retention-days: 7
          if-no-files-found: ignore
