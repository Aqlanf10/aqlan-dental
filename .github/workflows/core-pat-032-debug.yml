name: CORE-PAT-032 Focused Test

on:
  push:
    branches:
      - agent/core-pat-032-patient-number-routing

jobs:
  focused-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run focused test
        run: npx vitest run src/__tests__/components/patient/PatientProfileIdentifierRouting.test.tsx --reporter=verbose
