<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aqlan Dental Pro — مركز د. عقلان الكامل</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Tajawal', sans-serif;
      background: #eef3f9;
      color: #0d2137;
      direction: rtl;
      -webkit-font-smoothing: antialiased;
    }

    #root { height: 100%; }

    * { scrollbar-width: thin; scrollbar-color: #c8d8ea transparent; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #c8d8ea; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #a8c0d6; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    input, button, select, textarea { font-family: 'Tajawal', sans-serif; }

    input::placeholder { color: #94a3b8 !important; }
    input:focus { outline: none; }

    /* Smooth page transitions */
    .page-content { animation: fadeIn 0.2s ease; }

    /* Better table hover */
    tr { transition: background 0.12s; }

    /* Card hover lift */
    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(13,33,55,0.1) !important;
      transition: all 0.2s;
    }

    /* Badge pill */
    span[style*="border-radius: 99"] {
      white-space: nowrap;
    }

    /* Sidebar smooth scroll */
    ::-webkit-scrollbar { width: 4px; }

    /* Topbar shadow */
    @media (max-width: 1200px) {
      input[placeholder] { width: 160px !important; }
    }

    /* Active nav glow */
    button[style*="rgba(61,122,181,0.35)"] {
      box-shadow: inset 3px 0 0 #3d7ab5;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components/data.jsx"></script>
  <script type="text/babel" src="components/layout.jsx"></script>
  <script type="text/babel" src="components/LoginPage.jsx"></script>
  <script type="text/babel" src="components/DashboardPage.jsx"></script>
  <script type="text/babel" src="components/PatientsPage.jsx"></script>
  <script type="text/babel" src="components/OrthoPage.jsx"></script>
  <script type="text/babel" src="components/OtherPages.jsx"></script>
  <script type="text/babel" src="components/MessagingPage.jsx"></script>
  <script type="text/babel" src="components/ExtraPages.jsx"></script>
  <script type="text/babel" src="components/AdvancedFeatures.jsx"></script>
  <script type="text/babel" src="components/CephPage.jsx"></script>
  <script type="text/babel" src="components/App.jsx"></script>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
      <rect width="120" height="80" fill="#0d2137"/>
      <rect x="0" y="0" width="28" height="80" fill="#0a1c30"/>
      <circle cx="14" cy="20" r="8" fill="#3d7ab5" opacity="0.8"/>
      <rect x="6" y="34" width="16" height="3" rx="1.5" fill="#3d7ab5" opacity="0.5"/>
      <rect x="6" y="41" width="16" height="3" rx="1.5" fill="rgba(255,255,255,0.2)"/>
      <rect x="6" y="48" width="16" height="3" rx="1.5" fill="rgba(255,255,255,0.2)"/>
      <rect x="34" y="8" width="78" height="16" rx="4" fill="#fff" opacity="0.08"/>
      <rect x="34" y="30" width="35" height="20" rx="4" fill="#3d7ab5" opacity="0.3"/>
      <rect x="75" y="30" width="37" height="20" rx="4" fill="#f5922e" opacity="0.3"/>
      <rect x="34" y="56" width="78" height="16" rx="4" fill="#fff" opacity="0.06"/>
    </svg>
  </template>
</body>
</html>
