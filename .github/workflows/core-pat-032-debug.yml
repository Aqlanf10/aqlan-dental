name: CORE-PAT-032 Focused Test

on:
  push:
    branches:
      - agent/core-pat-032-patient-number-routing

permissions:
  contents: write

jobs:
  focused-test:
    if: ${{ !contains(github.event.head_commit.message, 'focused CORE-PAT-032 test output') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Capture focused test output
        run: |
          set +e
          npx vitest run src/__tests__/components/patient/PatientProfileIdentifierRouting.test.tsx --reporter=verbose > ../docs/audits/CORE-PAT-032_FOCUSED_TEST_OUTPUT.txt 2>&1
          status=$?
          printf '\nEXIT_STATUS=%s\n' "$status" >> ../docs/audits/CORE-PAT-032_FOCUSED_TEST_OUTPUT.txt
          exit 0
      - name: Commit diagnostic output
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/CORE-PAT-032_FOCUSED_TEST_OUTPUT.txt
          git commit -m "chore: capture focused CORE-PAT-032 test output"
          git push
