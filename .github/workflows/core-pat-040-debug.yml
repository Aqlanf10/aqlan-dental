name: CORE-PAT-040 Unit Test Diagnostics

on:
  push:
    branches:
      - agent/core-pat-040-active-patient-write-guard

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, 'CORE-PAT-040 unit test diagnostics') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release --warnaserror:CS9113
      - name: Capture failures
        run: |
          set +e
          dotnet test tests/AqlanDentalPro.UnitTests/AqlanDentalPro.UnitTests.csproj \
            --no-restore --no-build --configuration Release --verbosity normal \
            > ../docs/audits/CORE-PAT-040_UNIT_TEST_DIAGNOSTICS.txt 2>&1
          status=$?
          printf '\nEXIT_STATUS=%s\n' "$status" >> ../docs/audits/CORE-PAT-040_UNIT_TEST_DIAGNOSTICS.txt
          exit 0
      - name: Commit diagnostics
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/CORE-PAT-040_UNIT_TEST_DIAGNOSTICS.txt
          git commit -m "chore: capture CORE-PAT-040 unit test diagnostics"
          git push
