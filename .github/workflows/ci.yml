name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install native image codec dependencies
        # QA-597: SkiaSharp on Linux needs libwebp for WebP decode/encode.
        # Without it, OrthoCasePresentationTests.WebpPhoto_IsTranscodedAndEmbedded
        # fails intermittently when SkiaSharp falls back to a stub codec.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebp-dev

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release --warnaserror:CS9113

      - name: Run unit tests (with coverage)
        run: >
          dotnet test tests/AqlanDentalPro.UnitTests/AqlanDentalPro.UnitTests.csproj
          --no-restore --no-build --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Enforce coverage thresholds (baseline safety net)
        # TEST-19: Non-blocking baseline. Current coverage is ~6% lines / ~28% branches
        # (very large code-base, mostly untested). Aspirational targets are 60% lines / 50%
        # branches but those would break CI today. Safety-net thresholds below are set to
        # current-2% so the check still catches significant regressions without blocking.
        # Ratchet these up over time as more tests are added. Remove `continue-on-error`
        # once the safety net reaches 60% lines / 50% branches.
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob("TestResults/**/coverage.cobertura.xml", recursive=True)
          if not files:
              print("::warning::No coverage file found — skipping threshold check")
              raise SystemExit(0)
          tree = ET.parse(files[0])
          root = tree.getroot()
          line_rate = float(root.attrib["line-rate"]) * 100
          branch_rate = float(root.attrib["branch-rate"]) * 100
          print(f"::notice::Backend coverage — Lines: {line_rate:.2f}%  Branches: {branch_rate:.2f}%")
          print(f"Coverage file: {files[0]}")
          # Safety-net thresholds (current-2% baseline). Aspirational: 60% lines / 50% branches.
          LINE_THRESHOLD = 4.0
          BRANCH_THRESHOLD = 26.0
          ok = True
          if line_rate < LINE_THRESHOLD:
              print(f"::error::Line coverage {line_rate:.2f}% < {LINE_THRESHOLD}% safety-net threshold")
              ok = False
          if branch_rate < BRANCH_THRESHOLD:
              print(f"::error::Branch coverage {branch_rate:.2f}% < {BRANCH_THRESHOLD}% safety-net threshold")
              ok = False
          if ok:
              print(f"::notice::Coverage above safety-net thresholds (lines≥{LINE_THRESHOLD}% branches≥{BRANCH_THRESHOLD}%). Aspirational targets: 60% lines / 50% branches — ratchet up over time.")
          raise SystemExit(0 if ok else 1)
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          # CORE-F-013: the tests write to backend/TestResults (see --results-directory on the
          # test step); this path pointed at a directory that has never existed, so every run
          # logged "No files were found" and no unit .trx was ever uploaded.
          path: backend/TestResults/**/*.trx
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/TestResults/**/coverage.cobertura.xml
          retention-days: 7
          if-no-files-found: ignore

  backend-integration:
    name: Backend — Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run integration tests (TEST-18, Testcontainers PostgreSQL)
        # TEST-18 / C-08 safety net: these tests spin up a throwaway postgres:16-alpine
        # container via Testcontainers (Docker is preinstalled on GitHub-hosted ubuntu
        # runners, no extra service config needed) and exercise cross-request race
        # conditions (appointment double-booking, treasury concurrency, surgery status
        # transitions, patient access control) plus schema-drift detection between the
        # EF model and the live database. This job has NEVER run before in CI (the
        # project existed but was not wired in — see docs/agent-audit/c-08-startup-maintenance-audit.md
        # section 6).
        #
        # CORE-CI-001 — this step is now a real gate.
        #
        # It carried continue-on-error from the day it was wired in, which meant the job
        # reported success while all 32 tests failed underneath it. All 32 pass now, so the
        # line is gone and a failure here fails the build. If this step ever goes red, the
        # answer is to fix what it caught — restoring continue-on-error would put the repo
        # back to reporting a green tick over a suite that does not run.
        run: >
          dotnet test tests/AqlanDentalPro.IntegrationTests/AqlanDentalPro.IntegrationTests.csproj
          --no-restore --no-build --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=integration-test-results.trx"
          --results-directory ./TestResults

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-results
          # CORE-CI-001: --results-directory is ./TestResults relative to the `backend`
          # working directory, so results land in backend/TestResults — not under the test
          # project. Every run logged "No files were found" regardless of outcome.
          path: backend/TestResults/**/*.trx
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend — Lint, Type-check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run frontend tests (with coverage)
        run: npx vitest run --coverage --reporter=verbose

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Check e2e staging env
        id: gate
        env:
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
        run: |
          if [ -n "${E2E_API_URL}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_API_URL is set — Playwright will run against ${E2E_API_URL}"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_API_URL secret is not set — Playwright tests will be skipped (CI stays green)."
          fi

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.gate.outputs.enabled == 'true'
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        if: steps.gate.outputs.enabled == 'true'
        env:
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
          E2E_STAFF_PHONE: ${{ secrets.E2E_STAFF_PHONE }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
          E2E_PORTAL_USERNAME: ${{ secrets.E2E_PORTAL_USERNAME }}
          E2E_PORTAL_PASSWORD: ${{ secrets.E2E_PORTAL_PASSWORD }}
        run: npx playwright test

      # CORE-P1-S5 — say what this job actually verified.
      #
      # The problem this solves is not a failing test, it is a passing one. E2E_API_URL is set
      # but the four credential secrets are empty, so four of the five Playwright tests skip
      # and the job reports success. On the checks list "E2E — Playwright ✅" then stands for
      # "a login page rendered", while reading exactly like "the patient journey works".
      # Skipping is indistinguishable from passing, and that is the whole defect.
      #
      # This step always runs and always writes the counts into the run summary, so the claim
      # the job supports is legible without opening the log. Whether a credential-less run
      # should FAIL is the clinic owner's call, not CI's: set the repository variable
      # E2E_REQUIRE_AUTHENTICATED to "true" once staging credentials exist, and an unverified
      # journey becomes a red build. Until then it is a loud warning rather than a surprise
      # red main.
      - name: Report what E2E actually verified
        if: always() && steps.gate.outputs.enabled == 'true'
        env:
          E2E_REQUIRE_AUTHENTICATED: ${{ vars.E2E_REQUIRE_AUTHENTICATED }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys

          report = pathlib.Path("playwright-report/results.json")
          if not report.exists():
              print("::warning::No Playwright JSON report — cannot state what E2E verified.")
              raise SystemExit(0)

          data = json.loads(report.read_text(encoding="utf-8"))

          rows = []
          def walk(suite):
              for spec in suite.get("specs", []):
                  for test in spec.get("tests", []):
                      status = test.get("status", "unknown")
                      rows.append((spec.get("title", "?"), status))
              for child in suite.get("suites", []):
                  walk(child)
          for suite in data.get("suites", []):
              walk(suite)

          executed = [t for t in rows if t[1] not in ("skipped",)]
          skipped = [t for t in rows if t[1] == "skipped"]

          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as fh:
              fh.write("## E2E — what this run verified\n\n")
              if skipped:
                  fh.write(
                      f"**The authenticated patient journey was NOT verified.** "
                      f"{len(skipped)} of {len(rows)} tests were skipped because their "
                      f"credentials are absent, so a green tick here does not mean the journey "
                      f"works.\n\n")
              else:
                  fh.write(f"All {len(rows)} tests executed.\n\n")
              fh.write("| Test | Result |\n|---|---|\n")
              for title, status in rows:
                  fh.write(f"| {title} | {'⏭️ skipped' if status == 'skipped' else status} |\n")

          print(f"::notice::E2E executed {len(executed)} test(s), skipped {len(skipped)}.")

          if skipped:
              required = (os.environ.get("E2E_REQUIRE_AUTHENTICATED") or "").lower() == "true"
              message = (
                  f"{len(skipped)} E2E test(s) skipped — the authenticated patient journey is "
                  f"NOT verified by this run.")
              if required:
                  print(f"::error::{message} E2E_REQUIRE_AUTHENTICATED is set, so this is a failure.")
                  sys.exit(1)
              print(f"::warning::{message} Set the repository variable "
                    f"E2E_REQUIRE_AUTHENTICATED=true once staging credentials exist to make this fail.")
          PY

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/playwright-test-output/
          retention-days: 7
          if-no-files-found: ignore

  # ── Authenticated journey against a stack this job builds itself ──────────────
  #
  # CORE-P1-S5 / CORE-F-009. The `e2e` job above can only test a deployed staging
  # environment, and its authenticated specs skip because the credential secrets are
  # empty — which is why nobody noticed that two of those specs had rotted into
  # failure. This job needs no secrets and no staging: it stands up PostgreSQL, the
  # API and the frontend inside the runner, seeds them, and drives the real login.
  #
  # Everything it touches is disposable and synthetic. No production data, no secrets,
  # and the password below is meaningful only to a container that is destroyed minutes
  # later.
  e2e-ephemeral:
    name: E2E — Authenticated journey (ephemeral stack)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: aqlan_e2e
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The seed password the API boots with, and the password the account ends up on
      # after the mandatory first-login change. Both are throwaway by construction.
      E2E_SEED_PASSWORD: Ephemeral!Seed2026
      E2E_STAFF_PHONE: admin
      E2E_STAFF_PASSWORD: Ephemeral!Runner2026
      E2E_API_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Start the API
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ASPNETCORE_URLS: http://localhost:5080
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5433;Database=aqlan_e2e;Username=e2e;Password=e2e"
          Jwt__SecretKey: "ephemeral-e2e-jwt-secret-0123456789-abcdefghijklmnopqrs"
          ADMIN_DEFAULT_PASSWORD: ${{ env.E2E_SEED_PASSWORD }}
          # Required: with maintenance off, a fresh database is created with ZERO users and
          # nobody can log in, while the log still says the admin password "has been set".
          ENABLE_STARTUP_DB_MAINTENANCE: "true"
        run: |
          nohup dotnet run --project src/AqlanDentalPro.API/AqlanDentalPro.API.csproj \
            -c Release --no-launch-profile > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            sleep 5
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5080/health)" = "200" ]; then
              echo "API healthy after $((i * 5))s"; exit 0
            fi
          done
          echo "API did not become healthy"; tail -50 "$RUNNER_TEMP/api.log"; exit 1

      - name: Prepare the staff account
        env:
          API_URL: http://localhost:5080
          E2E_STAFF_USERNAME: ${{ env.E2E_STAFF_PHONE }}
        run: scripts/e2e/prepare-e2e-account.sh

      - name: Build and start the frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5080
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3000 > "$RUNNER_TEMP/frontend.log" 2>&1 &
          for i in $(seq 1 30); do
            sleep 3
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)" = "200" ]; then
              echo "Frontend up after $((i * 3))s"; exit 0
            fi
          done
          echo "Frontend did not start"; tail -50 "$RUNNER_TEMP/frontend.log"; exit 1

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Only the specs verified to pass against a from-scratch stack run here.
      # ceph-runtime and voice-recorder are deliberately excluded and tracked as
      # CORE-F-014 / CORE-F-015: the first hangs on the dashboard's loading gate after a
      # full page navigation, the second needs an existing conversation that a brand-new
      # instance does not have. Listing them explicitly beats a green job that quietly
      # skipped them — the exact failure this whole slice exists to remove.
      - name: Run the authenticated journey
        working-directory: frontend
        run: npx playwright test playwright-tests/auth.spec.ts playwright-tests/staging-smoke.spec.ts

      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ephemeral-api-log
          path: ${{ runner.temp }}/api.log
          retention-days: 7
          if-no-files-found: ignore
