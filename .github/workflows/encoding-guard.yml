name: Encoding Guard

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  w05-patch:
    if: github.head_ref == 'codex/w05-clinic-business-date' && github.actor != 'github-actions[bot]'
    name: Apply W05 Core Patch Once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/w05-clinic-business-date
          fetch-depth: 0

      - name: Execute embedded W05 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/w05-apply-core.yml').read_text(encoding='utf-8')
          opener = "          python - <<'PY'\n"
          start = workflow.index(opener) + len(opener)
          end = workflow.index("\n          PY\n", start)
          embedded = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in embedded.splitlines()
          )
          exec(compile(script, 'w05-apply-core', 'exec'))
          PY

      - name: Restore workflow and commit patch
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/encoding-guard.yml
          rm -f docs/release-readiness/.w05-apply-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(journey): enforce clinic business date across active paths"
          git push origin HEAD:codex/w05-clinic-business-date

  mojibake:
    name: Arabic Mojibake Guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Arabic UTF-8 text is not corrupted
        run: bash scripts/check-mojibake.sh

      - name: Check cephalometric AI documentation contract
        shell: pwsh
        run: ./scripts/check-ceph-ai-docs.ps1
