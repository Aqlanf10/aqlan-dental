name: CORE-PAT-027 Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'agent/core-pat-027-complete-clinical-summary' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-pat-027-complete-clinical-summary
          fetch-depth: 0

      - name: Apply complete clinical summary patch
        run: python scripts/core_pat_027_patch.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(patients): CORE-PAT-027 populate clinical summary"
          git push origin HEAD:agent/core-pat-027-complete-clinical-summary
