name: Encoding Guard

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  mojibake:
    name: Arabic Mojibake Guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Arabic UTF-8 text is not corrupted
        run: bash scripts/check-mojibake.sh
