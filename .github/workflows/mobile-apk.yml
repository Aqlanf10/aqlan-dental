name: Mobile APK

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: https://aqlan-dental.vercel.app
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Prepare and verify standalone APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/AqlanDentalPro-Standalone-Test.apk
          unzip -tq dist/AqlanDentalPro-Standalone-Test.apk
          if ! unzip -Z1 dist/AqlanDentalPro-Standalone-Test.apk | grep -q '^assets/index\.android\.bundle$'; then
            echo "Embedded JavaScript bundle is missing from the APK." >&2
            exit 1
          fi
          ls -lh dist/AqlanDentalPro-Standalone-Test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AqlanDentalPro-Standalone-Test-APK
          path: mobile/dist/AqlanDentalPro-Standalone-Test.apk
          if-no-files-found: error
          retention-days: 14
