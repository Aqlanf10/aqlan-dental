kind = "web"
previewPath = "/"
title = "Aqlan Dental Pro"
version = "1.0.0"
id = "artifacts/aqlan-dental"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23506

[services.development]
run = "bash -c 'cd /home/runner/workspace/.migration-backup/frontend && BACKEND_URL=http://localhost:8080 NEXT_PUBLIC_API_URL= exec npx next dev -p '\"$PORT\"' -H 0.0.0.0'"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aqlan-dental", "run", "build" ]
serve = "static"
publicDir = "artifacts/aqlan-dental/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23506"
BASE_PATH = "/"
